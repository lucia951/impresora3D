<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda 3D</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#e8590c;--ac2:#fff;--bd:#e2e0d9;--ok:#2b8a3e;--ko:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--sf:#222220;--tx:#f1efe8;--mu:#a3a199;--ac:#ff8a4c;--ac2:#1b1b1a;--bd:#38372f;--ok:#69db7c;--ko:#ff8787}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
header h1{font-size:1.15rem;margin:0 auto 0 0}
button,input,select{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:7px 12px}
button:disabled{opacity:.5;cursor:default}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
main{max-width:1000px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover}
.bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pr{font-weight:700;font-size:1.15rem}
.mu{color:var(--mu);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.cmpbtn.on{background:var(--ac);color:var(--ac2)}
#wa{position:fixed;right:14px;bottom:14px;z-index:9;background:#25d366;color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 2px 10px #0004}
</style>
</head>

/* ======================================= */

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var eur=function(n){return Number(n||0).toFixed(2).replace(".",",")+" €"};
var PAGOS=["Bizum","Transferencia bancaria","Contra reembolso","Efectivo (recogida en mano)"];
var cart={},cmp=[],view="shop",cat="Todo",form={};
try{cart=JSON.parse(localStorage.getItem("cart3d")||"{}")}catch(e){}
function save(){try{localStorage.setItem("cart3d",JSON.stringify(cart))}catch(e){}}
function prod(id){return P.find(function(p){return p.id===id})}
function wa(text){return "https://wa.me/"+WHATSAPP+(text?"?text="+encodeURIComponent(text):"")}
$("#wa").href=wa("Hola, tengo una duda sobre la tienda 3D.");

document.querySelectorAll("header button[data-v]").forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}});

function card(p){
  var inC=cart[p.id]||0,c=cmp.indexOf(p.id)>=0;
  return '<div class="card"><div class="ph">'+(p.img?'<img src="'+p.img+'" alt="'+esc(p.name)+'" loading="lazy">':'🧩')+'</div><div class="bd"><b>'+esc(p.name)+'</b><div class="mu">'+esc(p.desc)+'</div><div class="row"><span class="pr">'+eur(p.price)+'</span><span class="sp '+(p.stock>0?"ok":"ko")+'">'+(p.stock>0?(p.stock<=3?"Quedan "+p.stock:"En stock"):"Agotado")+'</span></div><div class="row"><button class="p" data-add="'+p.id+'"'+(p.stock<=inC?" disabled":"")+'>Añadir</button><button class="cmpbtn'+(c?" on":"")+'" data-cmp="'+p.id+'" title="Comparar">⚖️</button></div></div></div>';
}
function vShop(){
  var cats=["Todo"].concat(P.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
  return '<div class="row" style="margin-bottom:12px">'+cats.map(function(c){return '<button data-cat="'+esc(c)+'" class="'+(c===cat?"on":"")+'">'+esc(c)+'</button>'}).join("")+'</div><div class="grid">'+P.filter(function(p){return cat==="Todo"||p.cat===cat}).map(card).join("")+'</div>';
}
function vCmp(){
  var ps=cmp.map(prod).filter(Boolean);
  if(ps.length<2)return '<div class="box">Marca con ⚖️ al menos 2 productos en el catálogo (máximo 3).</div>';
  var rows=[["Foto",function(p){return p.img?'<img src="'+p.img+'" style="width:120px;border-radius:8px">':"🧩"}],["Precio",function(p){return eur(p.price)}],["Stock",function(p){return p.stock>0?p.stock+" uds.":"Agotado"}],["Categoría",function(p){return esc(p.cat)}],["Descripción",function(p){return esc(p.desc)}]];
  return '<div class="box tbl"><table><tr><th></th>'+ps.map(function(p){return '<th>'+esc(p.name)+'</th>'}).join("")+'</tr>'+rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+ps.map(function(p){return '<td>'+r[1](p)+'</td>'}).join("")+'</tr>'}).join("")+'</table></div>';
}
function items(){return Object.keys(cart).map(function(id){var p=prod(id);return p?{p:p,q:cart[id]}:null}).filter(Boolean)}
function vCart(){
  var it=items();
  if(!it.length)return '<div class="box">Tu carrito está vacío.</div>';
  var tot=it.reduce(function(a,x){return a+x.p.price*x.q},0);
  return '<div class="box tbl"><table>'+it.map(function(x){return '<tr><td>'+esc(x.p.name)+'</td><td>'+eur(x.p.price)+'</td><td><button data-q="'+x.p.id+'" data-d="-1">−</button> '+x.q+' <button data-q="'+x.p.id+'" data-d="1">+</button></td><td>'+eur(x.p.price*x.q)+'</td></tr>'}).join("")+'<tr><th colspan="3">Total (envío aparte)</th><th>'+eur(tot)+'</th></tr></table></div>'+
  '<div class="box"><h3 style="margin-top:0">Datos de envío y pago</h3><div class="f"><input id="f_n" placeholder="Nombre y apellidos" value="'+esc(form.n)+'"><input id="f_t" placeholder="Teléfono" value="'+esc(form.t)+'"><input id="f_a" placeholder="Dirección (calle, número, piso)" value="'+esc(form.a)+'"><input id="f_c" placeholder="Código postal y ciudad" value="'+esc(form.c)+'"><select id="f_p">'+PAGOS.map(function(x){return '<option'+(form.p===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div><p class="mu">Al pulsar se abre WhatsApp con tu pedido ya escrito. Solo tienes que enviarlo y te confirmamos el pago y el envío.</p><button class="p" id="buy">Enviar pedido por WhatsApp</button> <span id="msg" class="mu"></span></div>';
}
function readForm(){if(!$("#f_n"))return;form={n:$("#f_n").value,t:$("#f_t").value,a:$("#f_a").value,c:$("#f_c").value,p:$("#f_p").value}}
function buy(){
  readForm();
  if(!form.n.trim()||!form.t.trim()||!form.a.trim()||!form.c.trim()){$("#msg").textContent="Rellena todos los datos.";return}
  var it=items(),tot=it.reduce(function(a,x){return a+x.p.price*x.q},0);
  var t="Hola, quiero hacer este pedido:\n"+it.map(function(x){return "• "+x.q+" × "+x.p.name+" ("+eur(x.p.price*x.q)+")"}).join("\n")+"\n\nTotal: "+eur(tot)+" (envío aparte)\nNombre: "+form.n+"\nTeléfono: "+form.t+"\nDirección: "+form.a+", "+form.c+"\nForma de pago: "+form.p;
  window.open(wa(t),"_blank");
}
function render(){
  document.querySelectorAll("header button[data-v]").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  $("#nc").textContent=Object.keys(cart).reduce(function(a,k){return a+cart[k]},0);
  $("#nk").textContent=cmp.length;
  $("#app").innerHTML=view==="cart"?vCart():view==="cmp"?vCmp():vShop();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.add){cart[d.add]=(cart[d.add]||0)+1;save();render()}
  else if(d.q){readForm();var p=prod(d.q),q=(cart[d.q]||0)+Number(d.d);if(q<=0)delete cart[d.q];else if(q<=p.stock)cart[d.q]=q;save();render()}
  else if(d.cmp){var i=cmp.indexOf(d.cmp);if(i>=0)cmp.splice(i,1);else{if(cmp.length>=3)cmp.shift();cmp.push(d.cmp)}render()}
  else if(d.cat){cat=d.cat;render()}
  else if(t.id==="buy")buy();
});
document.addEventListener("input",readForm);
render();
</script>
</body>
